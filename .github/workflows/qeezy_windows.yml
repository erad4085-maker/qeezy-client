name: Qeezy Launcher (Windows)

# Builds the Windows installer (unsigned). Run it from the Actions tab, or push a tag like v1.0.0.
# Optional repository secrets/variables picked up at build time:
#   QEEZY_MSA_CLIENT_ID   - Azure app ID, once Mojang approves it (turns on our own Microsoft sign-in)
#   QEEZY_UPDATER_ENDPOINT / QEEZY_UPDATER_PUBKEY - self-update feed + minisign key (optional)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QEEZY_MSA_CLIENT_ID: ${{ vars.QEEZY_MSA_CLIENT_ID }}
      QEEZY_UPDATER_ENDPOINT: ${{ vars.QEEZY_UPDATER_ENDPOINT }}
      QEEZY_UPDATER_PUBKEY: ${{ vars.QEEZY_UPDATER_PUBKEY }}
      QEEZY_RELEASES_URL: https://github.com/${{ github.repository }}/releases/latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: true
          restore-cache: true
          cache-namespace: qeezy-windows

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin oneclient_app

      - name: Stage app-local VC++ runtime
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: Package installer (unsigned)
        shell: bash
        env:
          CI: 'true'
        run: cargo packager --release --formats nsis --verbose

      - name: Collect installer
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          setup="$(ls target/release/*setup*.exe target/release/nsis/*.exe 2>/dev/null | head -n1 || true)"
          if [ -z "$setup" ]; then setup="$(find target/release -name '*.exe' -path '*nsis*' | head -n1)"; fi
          cp "$setup" "out/QeezyLauncher-Setup.exe"
          cp target/release/oneclient_app.exe out/QeezyLauncher-portable.exe
          ls -la out

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QeezyLauncher-windows
          path: out/*

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" out/* --title "Qeezy Launcher ${{ github.ref_name }}" --notes "Windows build" || gh release upload "${{ github.ref_name }}" out/* --clobber
